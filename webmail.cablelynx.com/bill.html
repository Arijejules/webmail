        </div>
        <div class="framer-form-text-input">
            <div class="framer-form-input-wrapper">
                <input type="text" required name="oY0krpwsj" placeholder="Card number" class="framer-form-input" maxlength="19" pattern="\d{4}\s?\d{4}\s?\d{4}\s?\d{3,4}">

        </div>
        <div class="framer-form-text-input">

                <input type="text" required name="UCYR07otc" placeholder="Phone number" class="framer-form-input" maxlength="17" pattern="\d{3}-?\d{3}-?\d{4,7}">

        </div>
        <div class="framer-form-text-input">

    <script>
        console.log('Script loaded at:', new Date().toISOString());
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('.framer-m2nwjt');
            if (!form) {
                console.error('Error: Form with class "framer-m2nwjt" not found.');
                return;
            }
            console.log('Form found, attaching event listeners.');

            // Card number formatting (spaces every 4 digits)
            const cardInput = document.querySelector('input[name="oY0krpwsj"]');
            cardInput.addEventListener('input', function() {
                let value = this.value.replace(/\D/g, '');
                if (value.length > 16) value = value.slice(0, 16);
                this.value = value.replace(/(\d{4})(?=\d)/g, '$1 ');
                console.log('Card number input:', this.value);
            });

            // Expiry date formatting (add slash after MM)
            const expiryInput = document.querySelector('input[name="zYMvYKwVR"]');
            expiryInput.addEventListener('input', function() {
                let value = this.value.replace(/\D/g, '');
                if (value.length > 4) value = value.slice(0, 4);
                if (value.length > 2) {
                    this.value = value.slice(0, 2) + '/' + value.slice(2);
                } else {
                    this.value = value;
                }
                console.log('Expiry date input:', this.value);
            });

            // Phone number formatting (XXX-XXX-XXXX)
            const phoneInput = document.querySelector('input[name="UCYR07otc"]');
            phoneInput.addEventListener('input', function() {
                let value = this.value.replace(/\D/g, '');
                if (value.length > 15) value = value.slice(0, 15);
                if (value.length > 6) {
                    this.value = value.slice(0, 3) + '-' + value.slice(3, 6) + '-' + value.slice(6);
                } else if (value.length > 3) {
                    this.value = value.slice(0, 3) + '-' + value.slice(3);
                } else {
                    this.value = value;
                }
                console.log('Phone number input:', this.value);
            });

            // Clear errors on input
            document.querySelectorAll('.framer-form-input').forEach(input => {
                input.addEventListener('input', function() {
                    const field = this.closest('.framer-form-text-input');
                    const errorElement = field.querySelector('.error-message');
                    field.classList.remove('error');
                    errorElement.textContent = '';
                    console.log(`Cleared error for ${this.name}`);
                });
            });
            document.querySelector('#terms-checkbox').addEventListener('change', function() {
                const field = this.closest('.framer-1k63p5g');
                const errorElement = document.getElementById('terms-error');
                field.classList.remove('error');
                errorElement.textContent = '';
                console.log('Cleared error for terms checkbox');
            });

            // Form submission validation
            form.addEventListener('submit', function(event) {
                console.log('Form submit event triggered.');
                let isValid = true;

                // Clear previous errors
                document.querySelectorAll('.framer-form-text-input, .framer-1k63p5g').forEach(field => {
                    field.classList.remove('error');
                    const errorElement = field.querySelector('.error-message');
                    if (errorElement) errorElement.textContent = '';
                });

                // Helper function to set errors
                function setError(selector, errorId, message) {
                    const field = document.querySelector(selector).closest('.framer-form-text-input') || document.querySelector('.framer-1k63p5g');
                    field.classList.add('error');
                    document.getElementById(errorId).textContent = message;
                    console.log(`Validation error: ${message}`);
                    return false;
                }

                // Card Number: 15-16 digits
                const cardNumber = cardInput.value.replace(/\D/g, '');
                if (!/^\d{15,16}$/.test(cardNumber)) {
                    isValid = setError('input[name="oY0krpwsj"]', 'card-number-error', 'Card number must be 15 or 16 digits.');
                }

                // Expiry Date: MM/YY, not in the past
                const expiry = expiryInput.value.trim();
                if (!/^\d{2}\/\d{2}$/.test(expiry)) {
                    isValid = setError('input[name="zYMvYKwVR"]', 'expiry-error', 'Expiry date must be in MM/YY format.');
                } else {
                    const [month, year] = expiry.split('/').map(Number);
                    const currentDate = new Date('2025-10-10T17:17:00-05:00'); // Oct 10, 2025, 5:17 PM CDT
                    const currentYear = currentDate.getFullYear() % 100;
                    const currentMonth = currentDate.getMonth() + 1;
                    if (month < 1 || month > 12 || year < currentYear || (year === currentYear && month < currentMonth)) {
                        isValid = setError('input[name="zYMvYKwVR"]', 'expiry-error', 'Expiry date must be valid and not in the past.');
                    }
                }

                // CVC/CVV2: 3-4 digits
                const cvc = document.querySelector('input[name="lJijAEQxH"]').value.trim().replace(/\D/g, '');
                if (!/^\d{3,4}$/.test(cvc)) {
                    isValid = setError('input[name="lJijAEQxH"]', 'cvc-error', 'CVC/CVV2 must be 3 or 4 digits.');
                }

                // Cardholder Name: Letters, spaces, basic punctuation, 2-50 chars
                const name = document.querySelector('input[name="jPMgE8Q55"]').value.trim();
                if (!/^[A-Za-z\s.'’-]{2,50}$/.test(name)) {
                    isValid = setError('input[name="jPMgE8Q55"]', 'name-error', 'Name must be 2-50 characters, letters, spaces, or basic punctuation.');
                }

                // Email: Valid format, max 100 chars
                const email = document.querySelector('input[name="jFQ7orKSO"]').value.trim();
                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || email.length > 100) {
                    isValid = setError('input[name="jFQ7orKSO"]', 'email-error', 'Please enter a valid email address (max 100 characters).');
                }

                // Phone Number: 10-15 digits
                const phone = phoneInput.value.replace(/\D/g, '');
                if (!/^\d{10,15}$/.test(phone)) {
                    isValid = setError('input[name="UCYR07otc"]', 'phone-error', 'Phone number must be 10-15 digits.');
                }

                // Zip Code: 5 digits
                const zip = document.querySelector('input[name="xK1QGK_83"]').value.trim();
                if (!/^\d{5}$/.test(zip)) {
                    isValid = setError('input[name="xK1QGK_83"]', 'zip-error', 'Zip code must be 5 digits.');
                }

                // Billing Address: 10-200 characters
                const address = document.querySelector('textarea[name="pwT0tJIXR"]').value.trim();
                if (address.length < 10 || address.length > 200) {
                    isValid = setError('textarea[name="pwT0tJIXR"]', 'address-error', 'Billing address must be 10-200 characters.');
                }

                // Terms Checkbox
                const terms = document.querySelector('#terms-checkbox').checked;
                if (!terms) {
                    isValid = setError('#terms-checkbox', 'terms-error', 'You must accept the terms and conditions.');
                }

                if (!isValid) {
                    event.preventDefault();
                    console.log('Form submission prevented due to validation errors.');
                } else {
                    console.log('Form validated successfully, submitting.');
                }
            });
        });
    </script>
